<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="polaroid: image hosting for agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="photo2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <!-- back polaroid -->
    <g transform="translate(150 78) rotate(-9 110 130)" filter="url(#shadow)">
      <rect width="220" height="262" rx="6" fill="#ece7dc"/>
      <rect x="16" y="16" width="188" height="188" rx="2" fill="url(#photo2)"/>
      <path d="M16 170 L70 120 L112 160 L150 128 L204 176 L204 204 L16 204 Z" fill="#0f172a" fill-opacity="0.35"/>
      <circle cx="160" cy="62" r="18" fill="#e0f2fe" fill-opacity="0.85"/>
    </g>

    <!-- front polaroid: a screenshot of an issue -->
    <g transform="translate(250 62) rotate(7 110 130)" filter="url(#shadow)">
      <rect width="220" height="262" rx="6" fill="#faf7f0"/>
      <rect x="16" y="16" width="188" height="188" rx="2" fill="url(#photo)"/>
      <!-- mini window -->
      <rect x="34" y="40" width="152" height="140" rx="8" fill="#0d1117" fill-opacity="0.88"/>
      <circle cx="48" cy="54" r="3.5" fill="#f87171"/>
      <circle cx="60" cy="54" r="3.5" fill="#fbbf24"/>
      <circle cx="72" cy="54" r="3.5" fill="#34d399"/>
      <rect x="46" y="72" width="96" height="7" rx="3.5" fill="#e6edf3" fill-opacity="0.9"/>
      <rect x="46" y="86" width="128" height="5" rx="2.5" fill="#8b949e" fill-opacity="0.7"/>
      <rect x="46" y="97" width="112" height="5" rx="2.5" fill="#8b949e" fill-opacity="0.7"/>
      <rect x="46" y="112" width="128" height="54" rx="4" fill="#fb923c" fill-opacity="0.25" stroke="#fb923c" stroke-opacity="0.8"/>
      <path d="M54 158 L80 132 L98 148 L114 136 L166 158 Z" fill="#fb923c" fill-opacity="0.75"/>
      <circle cx="150" cy="126" r="6" fill="#fde68a"/>
      <text x="110" y="240" text-anchor="middle" font-family="'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive" font-size="20" fill="#334155">screenshot.png</text>
    </g>

    <!-- wordmark -->
    <text x="560" y="190" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#title)">polaroid</text>
    <text x="564" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#cbd5e1">Image hosting for agents.</text>
    <text x="564" y="274" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Embed screenshots in GitHub issues, comments and PRs.</text>

    <!-- pills -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e2e8f0">
      <rect x="564" y="306" width="72" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="600" y="327" text-anchor="middle">MCP</text>
      <rect x="648" y="306" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="700" y="327" text-anchor="middle">GitHub</text>
      <rect x="764" y="306" width="232" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="880" y="327" text-anchor="middle">png · jpg · gif · webp</text>
    </g>
  </g>
</svg>
